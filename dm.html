<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DnD Wayfinder - DM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#x1F3B2;</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dm">
  <header class="dm-header">
    <a class="home-link" href="index.html" title="Back to adventure list">&larr; Adventures</a>
    <h1 id="advTitle">DM Screen</h1>
    <span id="syncNote" class="sync-note"></span>
    <div class="dm-controls">
      <button id="prevBtn" title="Previous scene (&larr;)">&larr;</button>
      <span id="sceneCounter"></span>
      <button id="nextBtn" title="Next scene (&rarr;)">&rarr;</button>
      <button id="sendBtn" title="Push this scene to the TV">Send to TV</button>
      <button id="followBtn" title="Auto-push every scene change">Auto</button>
      <button id="langBtn" title="Toggle read-aloud language (English / Norsk)">Norsk</button>
      <button id="combatBtn" title="Toggle combat view (hide non-combat details)">Combat</button>
    </div>
    <nav class="dm-tabs">
      <button data-tab="overview" class="active" aria-pressed="true">Overview</button>
      <button data-tab="scene">Scene</button>
      <button data-tab="monsters">Monsters</button>
      <button data-tab="documents">Documents</button>
    </nav>
  </header>
  <main class="dm-body">
    <aside class="scene-list" id="sceneList"></aside>
    <section class="dm-panel" id="panelOverview"></section>
    <section class="dm-panel hidden" id="panelScene">
      <div class="scene-image">
        <img id="sceneImg" alt="">
        <div id="sceneImages" class="scene-thumbs hidden"></div>
        <div id="battlemapSource" class="battlemap-source hidden"></div>
        <div class="scene-labels" id="sceneLabels"></div>
      </div>
      <div class="scene-detail">
        <h2 id="sceneTitle"></h2>
        <div id="sceneBody"></div>
      </div>
    </section>
    <section class="dm-panel hidden" id="panelMonsters">
      <input id="monsterSearch" type="search" placeholder="Filter monsters...">
      <div id="monsterList"></div>
    </section>
    <section class="dm-panel hidden" id="panelDocuments"></section>
  </main>
  <script src="js/common.js"></script>
  <script src="js/render.js"></script>
  <script src="js/dm.js"></script>
</body>
</html>
